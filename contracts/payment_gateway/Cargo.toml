[package]
name = "payment-gateway"
version = "0.1.0"
edition = "2021"
authors = ["NexaStellar <hello@nexastellar.dev>"]
license = "MIT"
repository = "https://github.com/NexaStellar/soroban-payment-gateway"
description = "Soroban smart contract for multi-token payment processing with escrow"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[package.metadata.docs.rs]
all-features = true
